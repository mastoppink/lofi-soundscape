# python -m lofigen batch batch_example.yaml
output_dir: output
defaults:
  duration: 1h
  format: flac          # wav / flac
  # cover: covers/default.jpg   # isi untuk otomatis membuat MP4
jobs:
  - {preset: rainy_cafe, name: rainy_cafe_vol1, seed: 101}
  - {preset: night_study, name: night_study_vol1, seed: 202, duration: 2h}
  - {preset: cozy_fireplace, name: fireplace_vol1, lofi: 0.7}
