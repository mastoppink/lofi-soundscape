name: Rainy Café
description: Rhodes hangat, drum jazz, hujan di jendela dan suasana kafe.
lofi: 0.55            # 0 = bersih, 1 = sangat 'kotor'/tape
vinyl: 0.6            # jumlah crackle vinyl
music_volume: 1.0
music:
  bpm: [72, 84]
  swing: 0.6          # 0.5 lurus, 0.66 triplet
  mood: 0.6           # 0 sendu (minor) .. 1 ceria (mayor)
  energy: 0.5
instruments:          # bank/preset General MIDI di soundfont
  keys:   {preset: 4, level: 1.4}             # Electric Piano (Rhodes)
  bass:   {preset: 32, level: 0.9}            # Acoustic Bass
  drums:  {bank: 128, preset: 32, drums: true, level: 0.6}   # Jazz kit
  melody: {preset: 11, level: 0.45}           # Vibraphone
ambience:             # nama folder di samples/ : volume
  rain: 0.55
  cafe: 0.35
